services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: promptlens
      POSTGRES_PASSWORD: promptlens
      POSTGRES_DB: promptlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptlens"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
